[package]
name = "boundary-instrumentation"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["rt", "macros", "time", "net"] }
axum = "=0.8.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "00_startup"
path = ".build/rust/00_startup/main.rs"
[[bin]]
name = "01_array_traversal"
path = ".build/rust/01_array_traversal/main.rs"
[[bin]]
name = "02_merge_sort"
path = ".build/rust/02_merge_sort/main.rs"
[[bin]]
name = "03_json_aggregate"
path = ".build/rust/03_json_aggregate/main.rs"
[[bin]]
name = "04_allocation_retention"
path = ".build/rust/04_allocation_retention/main.rs"
[[bin]]
name = "05_async_fanout"
path = ".build/rust/05_async_fanout/main.rs"
[[bin]]
name = "06_http_service"
path = ".build/rust/06_http_service/main.rs"
