[package]
name = "workload"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "workload"
path = "main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["rt", "macros", "time", "net"] }
libc = "=0.2.177"

axum = "=0.8.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
