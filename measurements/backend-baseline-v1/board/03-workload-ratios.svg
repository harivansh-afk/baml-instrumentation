  <g id="text_38">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #4d5665" transform="translate(45.36 564.054281)">Ratio of separate medians, 20 processes per configuration. Fixed finite warmup, not proven V8 steady state.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #4d5665" transform="translate(45.36 579.715187)">The suite is a chosen reference set, not a claim about every BAML program.</text>
