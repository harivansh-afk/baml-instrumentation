   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4d5665" x="45.36" y="67.32" transform="rotate(-0 45.36 67.32)">Stateful workflow; same work at every level; local file sink; median of 20 processes</text>
  </g>
  <g id="text_33">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #4d5665" transform="translate(45.36 564.054281)">Drain is a separate post-batch boundary. Recording bytes include preparation and warmup where present.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #4d5665" transform="translate(45.36 579.715187)">Small negative low-level overhead is noise, not evidence that enabling telemetry makes BAML faster.</text>
  </g>
